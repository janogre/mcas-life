version: '3.8'

services:
  # PostgreSQL Database
  mcas-db:
    image: postgres:16-alpine
    container_name: mcas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcas_life
      POSTGRES_USER: mcas_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mcas-db-data:/var/lib/postgresql/data
    networks:
      - mcas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcas_user -d mcas_life"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for sessions
  mcas-redis:
    image: redis:7-alpine
    container_name: mcas-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - mcas-redis-data:/data
    networks:
      - mcas-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  mcas-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: mcas-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://mcas_user:${DB_PASSWORD}@mcas-db:5432/mcas_life
      DATABASE_SSL: "false"
      DATABASE_MAX_CONNECTIONS: 20

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@mcas-redis:6379

      # JWT & Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      # Server
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: https://${DOMAIN}

      # Airthings Integration (optional)
      AIRTHINGS_CLIENT_ID: ${AIRTHINGS_CLIENT_ID:-}
      AIRTHINGS_CLIENT_SECRET: ${AIRTHINGS_CLIENT_SECRET:-}
      AIRTHINGS_REDIRECT_URI: ${AIRTHINGS_REDIRECT_URI:-}
    depends_on:
      mcas-db:
        condition: service_healthy
      mcas-redis:
        condition: service_healthy
    networks:
      - mcas-internal
      - proxy  # Connect to Traefik network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-compose_proxy"

      # API Router
      - "traefik.http.routers.mcas-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.mcas-api.entrypoints=websecure"
      - "traefik.http.routers.mcas-api.tls=true"
      - "traefik.http.routers.mcas-api.tls.certresolver=myresolver"

      # Service
      - "traefik.http.services.mcas-api.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend PWA
  mcas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api
    container_name: mcas-frontend
    restart: unless-stopped
    depends_on:
      - mcas-backend
    networks:
      - proxy  # Connect to Traefik network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-compose_proxy"

      # Frontend Router
      - "traefik.http.routers.mcas-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mcas-frontend.entrypoints=websecure"
      - "traefik.http.routers.mcas-frontend.tls=true"
      - "traefik.http.routers.mcas-frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.mcas-frontend.priority=1"

      # Service
      - "traefik.http.services.mcas-frontend.loadbalancer.server.port=80"

      # Security Headers
      - "traefik.http.middlewares.mcas-security.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.mcas-security.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.mcas-security.headers.customResponseHeaders.X-XSS-Protection=1; mode=block"
      - "traefik.http.routers.mcas-frontend.middlewares=mcas-security"

networks:
  mcas-internal:
    driver: bridge
  proxy:
    external: true
    name: n8n-compose_proxy

volumes:
  mcas-db-data:
    driver: local
  mcas-redis-data:
    driver: local
